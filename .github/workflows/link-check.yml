name: Weekly link check

# Re-checks every tool in the directory and commits the updated health badges (js/data.js).
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check links
        run: node scripts/check-links.mjs --apply --concurrency 12 --out scripts/link-report.json
      - name: Apply manual fix-ups
        run: node scripts/fixups.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- js/data.js scripts/link-report.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "azimuth-link-check"
          git config user.email "actions@users.noreply.github.com"
          git add js/data.js scripts/link-report.json
          git commit -m "Weekly link check: update tool health"
          git push
